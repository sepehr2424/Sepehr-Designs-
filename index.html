<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sepehr Designs — Web &amp; Digital Design Studio</title>
  <meta name="description" content="Sepehr Designs — premium web design and digital design studio." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section class="hero" id="hero">
    <div class="hero__bg" aria-hidden="true">
      <div class="hero__glows" id="heroGlows">
        <div class="hero__glow hero__glow--one"></div>
        <div class="hero__glow hero__glow--two"></div>
      </div>
      <div class="hero__grid"></div>
      <div class="hero__grain"></div>
    </div>

    <div class="hero__content">
      <p class="hero__eyebrow">Web &amp; Digital Design Studio</p>

      <h1 class="hero__headline">
        Design that
        <span class="hero__headline-line">feels inevitable.</span>
      </h1>

      <p class="hero__subline">
        Crafted digital experiences for brands that refuse to look ordinary.
      </p>

      <a href="#" class="cta" id="bookCallBtn">
        <span class="cta__glow" aria-hidden="true"></span>
        <span class="cta__label">Book a Call</span>
      </a>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
